# Roda os testes do servidor a cada push e pull request, pra pegar erro
# antes de chegar no site.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  servidor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm test
